<div class="dashboard-layout">
  <div class="blob blob-purple"></div>
  <div class="blob blob-cyan"></div>

  <!-- Dynamically Sized Sidebar -->
  <app-sidebar
    [style.width.px]="sidebarWidth()"
    [chatHistory]="chatHistory()"
    [configuredRepos]="configuredRepos()"
    [activeThreadId]="activeThreadId()"
    (newChatRequested)="onNewChat()"
    (threadSelected)="activeThreadId.set($event)"
    (openConfigRequested)="isModalOpen.set(true)"
  ></app-sidebar>

  <!-- Draggable Resizer Splitter Bar -->
  <div class="resizer" (mousedown)="startResizing($event)"></div>

  <!-- Flexible Chat Window -->
  <app-chat-window
    [configuredRepos]="configuredRepos()"
    [selectedRepo]="selectedRepo()"
    [messages]="messages()"
    (repoChanged)="selectedRepo.set($event)"
    (messageSent)="onSendMessage($event)"
  ></app-chat-window>

  @if (isModalOpen()) {
    <app-repo-config-modal (closeModal)="isModalOpen.set(false)"></app-repo-config-modal>
  }
</div>
