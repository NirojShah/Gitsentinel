<div class="dashboard-layout">
  <div class="blob blob-purple"></div>
  <div class="blob blob-cyan"></div>

  <!-- Top Navigation Bar -->
  <app-navbar
    [activeRepo]="selectedRepoName()"
    (newChatRequested)="onNewChat()"
    (openConfigRequested)="openRepoConfig()"
  ></app-navbar>

  <!-- MCP Status Component -->
  <div class="mcp-status-wrapper">
    <app-mcp-status [repositoryId]="selectedRepo()"></app-mcp-status>
  </div>

  <!-- Main Content Layout Below Navbar -->
  <div class="content-body">
    <app-sidebar
      [style.width.px]="sidebarWidth()"
      [chatHistory]="chatHistory()"
      [configuredRepos]="configuredRepos()"
      [activeThreadId]="activeThreadId()"
      (newChatRequested)="onNewChat()"
      (threadSelected)="onThreadSelected($event)"
      (renameThreadRequested)="onRenameChat($event)"
      (deleteThreadRequested)="onDeleteChat($event)"
      (editRepositoryRequested)="onEditRepository($event)"
      (deleteRepositoryRequested)="onDeleteRepository($event)"
      (openConfigRequested)="openRepoConfig()"
    ></app-sidebar>

    <div class="resizer" (mousedown)="startResizing($event)"></div>

    <app-chat-window
      [configuredRepos]="configuredRepos()"
      [selectedRepo]="selectedRepo()"
      [activeThreadId]="activeThreadId()"
      [messages]="messages()"
      [errorMessage]="displayedError()"
      [isLoading]="isLoadingMessages()"
      [isSending]="isSendingMessage()"
      (repoChanged)="selectedRepo.set($event)"
      (messageSent)="onSendMessage($event)"
      (deleteMessageRequested)="onDeleteMessage($event)"
      (openConfigRequested)="openRepoConfig()"
    ></app-chat-window>
  </div>

  @if (isModalOpen()) {
    <app-repo-config-modal
      [repository]="editingRepository()"
      (closeModal)="closeRepoConfig()"
      (repoSaved)="onRepositoriesSaved()"
    ></app-repo-config-modal>
  }
</div>
