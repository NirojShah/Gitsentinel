<div class="login-wrapper">
  <div class="blob blob-cyan"></div>
  <div class="blob blob-purple"></div>

  <div class="glass-card">
    <div class="header">
      <h2>Welcome Back</h2>
      <p>Enter your credentials to access your account</p>
    </div>

    <form (ngSubmit)="handleLogin()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="name@example.com" [ngModel]="email()"
          (ngModelChange)="email.set($event)" name="email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" [ngModel]="password()"
          (ngModelChange)="password.set($event)" name="password" required />
      </div>

      <div class="form-actions">
        <app-button title="Sign In" type="primary" size="lg"></app-button>
      </div>
      <div class="err-message">
        {{message()}}
      </div>
    </form>
  </div>
</div>
