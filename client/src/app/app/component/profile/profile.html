<section class="profile-card" aria-label="User profile">
  @if (isLoading()) {
    <p role="status">Loading profile...</p>
  } @else if (profileInfo(); as profile) {
    <div class="profile-avatar" aria-hidden="true">{{ profileIcon?.initials }}</div>
    <h2>{{ profile.name || profile.username }}</h2>
    <p>{{ profile.email }}</p>
    <p>Account status: {{ profile.isActive ? 'Active' : 'Inactive' }}</p>
  } @else {
    <p role="alert">{{ errorMessage() }}</p>
  }
</section>
